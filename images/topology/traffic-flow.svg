<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450">
<rect width="1200" height="450" fill="#ffffff"/>
<style>.t{font-family:Arial,sans-serif;fill:#111}.title{font-size:26px;font-weight:700}.h{font-size:18px;font-weight:700}.p{font-size:14px}.box{fill:#f7f7f7;stroke:#222;stroke-width:2}.line{stroke:#222;stroke-width:3;fill:none}</style>
<text x="600" y="45" text-anchor="middle" class="t title">Main Security Traffic Flows</text>
<rect x="60" y="145" width="200" height="90" rx="10" class="box"/>
<text x="160" y="180" text-anchor="middle" class="t h">Browser-PC</text>
<text x="160" y="205" text-anchor="middle" class="t p">VLAN 10 / 10.21.75.110</text>
<rect x="360" y="125" width="240" height="130" rx="10" class="box"/>
<text x="480" y="170" text-anchor="middle" class="t h">FortiGate</text>
<text x="480" y="195" text-anchor="middle" class="t p">Firewall / NAT / filtering</text>
<text x="480" y="220" text-anchor="middle" class="t p">Security policy enforcement</text>
<rect x="700" y="75" width="220" height="80" rx="10" class="box"/>
<text x="810" y="108" text-anchor="middle" class="t h">WEB-SERVER-LAB</text>
<text x="810" y="132" text-anchor="middle" class="t p">10.21.75.130 : 443</text>
<rect x="700" y="260" width="220" height="80" rx="10" class="box"/>
<text x="810" y="293" text-anchor="middle" class="t h">DB-SERVER-LAB</text>
<text x="810" y="317" text-anchor="middle" class="t p">10.21.75.146 : 3306</text>
<rect x="1000" y="160" width="140" height="90" rx="10" class="box"/>
