<text x="1070" y="220" text-anchor="middle" class="t p">NAT</text>
<path d="M260 190 H360" class="line"/>
<path d="M600 170 L700 115" class="line"/>
<path d="M600 215 L700 300" class="line"/>
<path d="M600 190 H1000" class="line"/>
<text x="310" y="178" text-anchor="middle" class="t p">VLAN 10</text>
<text x="650" y="130" text-anchor="middle" class="t p">Users → WEB</text>
<text x="650" y="285" text-anchor="middle" class="t p">WEB → DB : 3306 only</text>
<text x="800" y="180" text-anchor="middle" class="t p">Policies / logging / filtering</text>
<text x="600" y="405" text-anchor="middle" class="t p">User traffic is inspected and controlled at the FortiGate.</text>
